spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQLDB_LOCAL_PORT:3307}/${MYSQL_DATABASE:car_sharing_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:car_sharing_admin}
    password: ${MYSQL_PASSWORD:secure_password}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always