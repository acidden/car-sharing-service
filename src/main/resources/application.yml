spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQLDB_LOCAL_PORT:3307}/${MYSQL_DATABASE:car_sharing_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:car_sharing_admin}
    password: ${MYSQL_PASSWORD:secure_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always

jwt:
  secret: "VeryLongAndSecureKeyWithAtLeast32Characters"
  expiration: 86400000

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:mock_token_for_tests}
  chat:
    id: ${TELEGRAM_CHAT_ID:mock_id_for_tests}

stripe:
  public-key: ${STRIPE_PUBLISHABLE_KEY}
  secret-key: ${STRIPE_SECRET_KEY:mock_key}

carsharing:
  fine:
    multiplier: 2.0
