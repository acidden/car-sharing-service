spring:
  datasource:
    url: jdbc:h2:mem:car_sharing_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    enabled: false

jwt:
  secret: "VeryLongAndSecureKeyWithAtLeast32CharactersForJwtSecurityTestingPurposesOnly!"
  expiration: 86400000
